
<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head th:replace="Fragments/fragment::page_head('','none')"></head>
<body>

<!-- header -->
<div th:replace="~{Fragments/header :: header}">...</div>
<!-- //header -->


<!-- inner banner -->
<section class="inner-banner py-5">
    <div class="w3l-breadcrumb py-lg-5">
        <div class="container pt-4 pb-sm-4">
            <h4 class="inner-text-title pt-5">Dashboard</h4>
            <ul class="breadcrumbs-custom-path">
                <li class="active"><a th:href="@{/index}">Dashboard</a></li>
<!--                <li class="active"><i class="fas fa-angle-right"></i>Dashboard</li>-->
            </ul>
        </div>
    </div>
</section>


<!-- Welcome block -->
<!-- Welcome block -->
<section class="py-5 bg-light" id="dashboard">
    <div class="container">
        <div class="text-center mb-5">
            <h2 class="fw-bold" sec:authentication="principal.fullName">BOB</h2>
            <p class="text-muted mb-1" th:text="${'You logged in as - '}"></p>
            <p class="text-primary" sec:authentication="principal.authorities"></p>
        </div>

        <div class="row g-4">
            <th:block sec:authorize="hasAnyAuthority('Admin','Viewer')">
                <div class="col-md-6 col-lg-4">
                        <div class="card-body" th:replace="dashboard/user_summary :: content"></div>
                </div>
            </th:block>

            <th:block sec:authorize="hasAnyAuthority('Admin', 'Editor','Viewer')">
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body" th:replace="dashboard/category_summary :: content"></div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body" th:replace="dashboard/brand_summary :: content"></div>
                    </div>
                </div>
            </th:block>

            <th:block sec:authorize="hasAnyAuthority('Admin', 'Editor', 'Salesperson', 'Shipper','Viewer')">
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body" th:replace="dashboard/product_summary :: content"></div>
                    </div>
                </div>
            </th:block>

            <th:block sec:authorize="hasAnyAuthority('Admin', 'Assistant','Viewer')">
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body" th:replace="dashboard/question_summary :: content"></div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body" th:replace="dashboard/review_summary :: content"></div>
                    </div>
                </div>
            </th:block>

            <th:block sec:authorize="hasAnyAuthority('Admin', 'Salesperson','Viewer')">
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body" th:replace="dashboard/customer_summary :: content"></div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body" th:replace="dashboard/shipping_rate_summary :: content"></div>
                    </div>
                </div>
            </th:block>

            <th:block sec:authorize="hasAnyAuthority('Admin', 'Salesperson', 'Shipper','Viewer')">
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body" th:replace="dashboard/order_summary :: content"></div>
                    </div>
                </div>
            </th:block>

            <th:block sec:authorize="hasAnyAuthority('Admin', 'Editor','Viewer')">
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body" th:replace="dashboard/article_summary :: content"></div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body" th:replace="dashboard/menu_summary :: content"></div>
                    </div>
                </div>
            </th:block>

            <th:block sec:authorize="hasAnyAuthority('Admin','Viewer')">
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body" th:replace="dashboard/section_summary :: content"></div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body" th:replace="dashboard/setting_summary :: content"></div>
                    </div>
                </div>
            </th:block>
        </div>
    </div>
</section>

<!-- //Welcome block -->

<!--    COMMON JAVASCRIPT  -->
<div th:replace="Fragments/fragment::common_JS"></div>
<!--    /COMMON JAVASCRIPT  -->

<!--THEME CHANGE-->
<div th:replace="Fragments/fragment::theme_change"/>



</body>

</html>
